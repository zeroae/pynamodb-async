name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the add-on with official pynamodb
      run: |
        python -m pip install --upgrade pip
        python -m pip install . pytest 'pytest-asyncio>=0.23' pytest-env pytest-mock freezegun 'blinker>=1.3,<2.0'
    - name: Run dynamodb_local
      run: |
        wget --quiet http://dynamodb-local.s3-website-us-west-2.amazonaws.com/dynamodb_local_latest.tar.gz -O /tmp/dynamodb_local_latest.tar.gz
        tar -xzf /tmp/dynamodb_local_latest.tar.gz -C /tmp
        java -Djava.library.path=/tmp/DynamoDBLocal_lib -jar /tmp/DynamoDBLocal.jar -inMemory -port 8000 &
        for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:8000 && break; sleep 1; done
    - name: Run tests
      run: |
        python -c "import pynamodb, pynamodb_async; assert 'site-packages' in pynamodb.__file__, pynamodb.__file__"
        python -m pytest tests -p no:cacheprovider
